<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WB.PREDICTION</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
:root{--bg:#f2f5f3;--card:#fff;--tx:#17251d;--mut:#617268;--ac:#13995a;--ac2:#0b6b3f;--gold:#f5c542;--bd:#dbe5df;--code:#f0f6f2}
@media(prefers-color-scheme:dark){:root{--bg:#09130e;--card:#102016;--tx:#e8f3ec;--mut:#8aa596;--ac:#3ddc84;--ac2:#0f3d26;--gold:#f5c542;--bd:#1c3a2a;--code:#0a1810}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#0b6b3f,#13995a);color:#fff;padding:26px 0 20px}
header a{color:#fff}
.logo{font-size:1.9rem;font-weight:800;letter-spacing:.5px;display:block}
.logo b{color:var(--gold)}
.tag{opacity:.85;font-size:.92rem}
nav{background:var(--ac2);position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;white-space:nowrap}
nav a{color:#e8fff1;padding:12px 15px;font-size:.88rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
nav a:hover,nav a.on{background:rgba(255,255,255,.14);text-decoration:none}
nav a.post{margin-left:auto;background:var(--gold);color:#2b2100}
.layout{display:grid;grid-template-columns:1fr 280px;gap:18px;margin:18px auto}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:16px}
.box h3{margin:0 0 10px;font-size:1rem;border-left:4px solid var(--gold);padding-left:9px}
.item{padding:14px 0;border-bottom:1px dashed var(--bd)}
.item:last-child{border:0}
.item h2{margin:0 0 3px;font-size:1.12rem}
.item h2 a{color:var(--tx)}
.item p{margin:4px 0 0;color:var(--mut);font-size:.9rem}
.meta{color:var(--mut);font-size:.78rem}
.chip{display:inline-block;background:var(--code);color:var(--ac);border:1px solid var(--bd);border-radius:5px;padding:0 8px;font-size:.72rem;margin-right:4px}
input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:12px}
.side a{display:block;padding:6px 0;border-bottom:1px solid var(--bd);color:var(--tx);font-size:.9rem}
.side a span{float:right;color:var(--mut);font-size:.78rem}
article h1{margin:4px 0 6px;line-height:1.25}
.ct{overflow-wrap:anywhere}
.ct img{max-width:100%;border-radius:8px}
.ct pre,.ct code{background:var(--code);font-family:ui-monospace,Menlo,Consolas,monospace}
.ct pre{padding:12px;border-radius:8px;overflow:auto;border:1px solid var(--bd)}
.ct table{border-collapse:collapse;width:100%;display:block;overflow:auto}
.ct td,.ct th{border:1px solid var(--bd);padding:6px 10px}
.ct blockquote{margin:0;padding-left:12px;border-left:3px solid var(--gold);color:var(--mut)}
.cm{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--bd)}
.cm img{width:36px;height:36px;border-radius:50%;flex:none}
.cm .b{min-width:0;flex:1}
.btn{display:inline-block;background:var(--ac);color:#fff;padding:9px 18px;border-radius:8px;font-weight:700;margin-top:10px}
.btn:hover{text-decoration:none;opacity:.9}
.msg{text-align:center;color:var(--mut);padding:30px 0}
footer{background:var(--ac2);color:#cfeedd;text-align:center;font-size:.82rem;padding:20px}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#/">WB<b>.</b>PREDICTION</a>
  <div class="tag" id="tag"></div>
</div></header>
<nav><div class="wrap" id="menu"></div></nav>
<div class="wrap layout">
  <main id="app"><div class="box msg">Memuat…</div></main>
  <aside class="side" id="side"></aside>
</div>
<footer>© WB.PREDICTION · Semoga hoki dan beruntung 🍀</footer>
<script>
/* ====== UBAH DI SINI ====== */
const OWNER = "bototomart787-png";
const REPO  = "Scenangka";
const TAGLINE = "Info dan Prediksi Terbaru";
const LABEL = "";             // isi "post" agar hanya Issue berlabel itu yg tampil
const BLOCKED = [];           // username yg disembunyikan
const HIDE_LABEL = "hidden";  // Issue berlabel ini disembunyikan
/* ========================== */
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
document.getElementById("tag").textContent = TAGLINE;
const app = document.getElementById("app");
let posts = [], q = "", cat = "";

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => new Date(d).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const md  = t => DOMPurify.sanitize(marked.parse(t || "", {breaks:true}));
const excerpt = t => (t||"").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/<[^>]+>/g,"").replace(/[#*`>\[\]_-]/g,"").replace(/\s+/g," ").trim().slice(0,150);
const cache = {};

async function j(url, key){
  try{ const c = JSON.parse(sessionStorage.getItem(key)); if(c && Date.now()-c.t < 300000) return c.d; }catch(e){}
  const r = await fetch(url);
  if(!r.ok) throw new Error(r.status===403 ? "Batas API GitHub tercapai, coba lagi nanti." : "Repo/Issues tidak ditemukan.");
  const d = await r.json();
  try{ sessionStorage.setItem(key, JSON.stringify({t:Date.now(), d})); }catch(e){}
  return d;
}
async function load(){
  const bl = BLOCKED.map(x => x.toLowerCase());
  const d = await j(`${API}/issues?state=open&per_page=100` + (LABEL?`&labels=${encodeURIComponent(LABEL)}`:""), "wb_posts_v2");
  return d.filter(i => !i.pull_request && !bl.includes(i.user.login.toLowerCase()) && !i.labels.some(l => l.name===HIDE_LABEL));
}

function chrome(){
  const cats = [...new Set(posts.flatMap(p => p.labels.map(l => l.name)))].filter(n => n!==LABEL);
  document.getElementById("menu").innerHTML =
    `<a href="#/" class="${!cat?"on":""}" data-c="">Beranda</a>` +
    cats.map(c => `<a href="#/" class="${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</a>`).join("") +
    `<a class="post" target="_blank" rel="noopener" href="https://github.com/${OWNER}/${REPO}/issues/new">+ Posting</a>`;
  document.querySelectorAll("#menu a[data-c]").forEach(a => a.onclick = () => { cat = a.dataset.c; q = ""; });
  const recent = posts.slice(0,6).map(p => `<a href="#/${p.number}">${esc(p.title)}</a>`).join("");
  const counts = cats.map(c => `<a href="#/" data-c="${esc(c)}">${esc(c)} <span>${posts.filter(p=>p.labels.some(l=>l.name===c)).length}</span></a>`).join("");
  document.getElementById("side").innerHTML =
    `<div class="box"><h3>Postingan Terbaru</h3>${recent||'<span class="meta">Belum ada.</span>'}</div>` +
    (cats.length ? `<div class="box"><h3>Kategori</h3>${counts}</div>` : "") +
    `<div class="box"><h3>Ikut Posting</h3><span class="meta">Semua orang boleh posting lewat akun GitHub.</span><br><a class="btn" target="_blank" rel="noopener" href="https://github.com/${OWNER}/${REPO}/issues/new">Tulis Posting</a></div>`;
  document.querySelectorAll("#side [data-c]").forEach(a => a.onclick = () => { cat = a.dataset.c; q = ""; });
}

function home(){
  document.title = "WB.PREDICTION";
  const shown = posts.filter(p => (!cat || p.labels.some(l => l.name===cat)) && (p.title+" "+(p.body||"")).toLowerCase().includes(q.toLowerCase()));
  app.innerHTML = `<div class="box"><input id="q" placeholder="Cari postingan…" value="${esc(q)}">
    <h3>${cat ? esc(cat) : "Postingan Terbaru"}</h3><div id="list"></div></div>`;
  const draw = list => document.getElementById("list").innerHTML = list.map(p => `<div class="item">
      <h2><a href="#/${p.number}">${esc(p.title)}</a></h2>
      <div class="meta">${p.labels.map(l=>`<span class="chip">${esc(l.name)}</span>`).join("")}${esc(p.user.login)} · ${fmt(p.created_at)} · 💬 ${p.comments}</div>
      <p>${esc(excerpt(p.body))}…</p></div>`).join("") || '<div class="msg">Belum ada postingan.</div>';
  draw(shown);
  document.getElementById("q").oninput = e => { q = e.target.value; draw(posts.filter(p => (!cat || p.labels.some(l => l.name===cat)) && (p.title+" "+(p.body||"")).toLowerCase().includes(q.toLowerCase()))); };
  chrome();
}

async function post(n){
  const p = posts.find(x => x.number==n);
  if(!p){ app.innerHTML = '<div class="box msg">Postingan tidak ditemukan. <a href="#/">Beranda</a></div>'; return; }
  document.title = p.title + " · WB.PREDICTION";
  app.innerHTML = `<div class="box"><article>
    <div class="meta"><a href="#/">Beranda</a> › ${p.labels.map(l=>`<span class="chip">${esc(l.name)}</span>`).join("")}</div>
    <h1>${esc(p.title)}</h1>
    <div class="meta"><img src="${esc(p.user.avatar_url)}" width="18" height="18" style="border-radius:50%;vertical-align:middle"> ${esc(p.user.login)} · ${fmt(p.created_at)}</div>
    <div class="ct">${md(p.body)}</div>
    <button class="btn" id="cp" style="border:0;cursor:pointer">🔗 Salin link</button></article></div>
    <div class="box"><h3>Komentar (${p.comments})</h3><div id="cms" class="meta">Memuat komentar…</div>
    <a class="btn" target="_blank" rel="noopener" href="${esc(p.html_url)}#issuecomment-new">Tulis Komentar</a></div>`;
  window.scrollTo(0,0); chrome();
  document.getElementById("cp").onclick = e => {
    const u = location.href.replace(/[^/]*$/,"").replace(/#.*$/,"") + "p/" + p.number + ".html";
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => e.target.textContent = "✅ Link tersalin", () => prompt("Salin link:", u));
  };
  if(!p.comments){ document.getElementById("cms").textContent = "Belum ada komentar."; return; }
  try{
    const bl = BLOCKED.map(x => x.toLowerCase());
    const c = (await j(`${API}/issues/${p.number}/comments?per_page=100`, "wb_c_"+p.number)).filter(x => !bl.includes(x.user.login.toLowerCase()));
    document.getElementById("cms").innerHTML = c.map(x => `<div class="cm"><img src="${esc(x.user.avatar_url)}" alt="">
      <div class="b"><b>${esc(x.user.login)}</b> <span class="meta">${fmt(x.created_at)}</span><div class="ct">${md(x.body)}</div></div></div>`).join("") || "Belum ada komentar.";
  }catch(e){ document.getElementById("cms").textContent = e.message; }
}

function route(){ const m = location.hash.match(/^#\/(\d+)/); if(m) post(m[1]); else home(); }
(async()=>{
  try{ posts = await load(); }catch(e){ app.innerHTML = `<div class="box msg">${esc(e.message)}</div>`; return; }
  window.addEventListener("hashchange", route);
  document.addEventListener("click", e => { if(e.target.closest("[data-c]")) setTimeout(route, 0); });
  route();
})();
</script>
</body>
</html>
